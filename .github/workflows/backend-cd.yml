name: Backend CD

on:
  push:
    branches:
      - dev
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.repository == '1024XEngineer/Holonic-Asset'
    env:
      SSH_HOST: ${{ secrets.DEV_BACKEND_SSH_HOST }}
      SSH_PORT: ${{ secrets.DEV_BACKEND_SSH_PORT || '22' }}
      SSH_USER: ${{ secrets.DEV_BACKEND_SSH_USER }}
      SSH_PASSWORD: ${{ secrets.DEV_BACKEND_SSH_PASSWORD }}
      DEPLOY_DIR: "/usr/local/bin/holonic-asset"
      SYSTEMD_SERVICE: "holonic-asset.service"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: core-api/go.mod

      - name: Build Linux backend
        working-directory: core-api
        run: |
          go build -trimpath -ldflags="-s -w" -o dist/app .

      - name: Install sshpass
        run: sudo apt-get install -y sshpass

      - name: Upload binary and restart service
        run: |
          sshpass -p "$SSH_PASSWORD" scp \
            -P "$SSH_PORT" \
            -o StrictHostKeyChecking=no \
            core-api/dist/app \
            "${SSH_USER}@${SSH_HOST}:${DEPLOY_DIR}/app.incoming"


          sshpass -p "$SSH_PASSWORD" ssh \
            -p "$SSH_PORT" \
            -o StrictHostKeyChecking=no \
            "${SSH_USER}@${SSH_HOST}" \
            "chmod +x ${DEPLOY_DIR}/app.incoming && mv -f ${DEPLOY_DIR}/app.incoming ${DEPLOY_DIR}/app && sudo systemctl restart ${SYSTEMD_SERVICE}"