name: Frontend Coverage

on:
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-coverage.yml"
  push:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-coverage.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-coverage-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    name: Check frontend coverage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.0
        with:
          version: 11.5.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate coverage report
        run: pnpm test:coverage:report

      - name: Check out main coverage baseline
        if: github.event_name == 'pull_request'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          path: .coverage-baseline

      - name: Check whether main has coverage support
        if: github.event_name == 'pull_request'
        id: baseline-coverage
        run: |
          if test -f ../.coverage-baseline/frontend/scripts/check-coverage.mjs; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install main dependencies
        if: steps.baseline-coverage.outputs.available == 'true'
        working-directory: .coverage-baseline/frontend
        run: pnpm install --frozen-lockfile

      - name: Generate main coverage report
        if: steps.baseline-coverage.outputs.available == 'true'
        working-directory: .coverage-baseline/frontend
        run: pnpm test:coverage:report

      - name: Enforce coverage gates
        env:
          BASELINE_COVERAGE: ${{ steps.baseline-coverage.outputs.available == 'true' && '../.coverage-baseline/frontend/coverage/coverage-final.json' || '' }}
        run: node scripts/check-coverage.mjs coverage/coverage-final.json "$BASELINE_COVERAGE"
