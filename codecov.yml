coverage:
  status:
    project:
      frontend:
        flags:
          - frontend
        target: auto
        threshold: 0%
        informational: true
      backend:
        flags:
          - backend
        target: auto
        threshold: 0%
        informational: false

flags:
  frontend:
    paths:
      - frontend/
    carryforward: true
  backend:
    paths:
      - core-api/
    carryforward: true
