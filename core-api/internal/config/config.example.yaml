db:
  dsn: postgres://postgres:postgres@localhost:5432/holonic_asset?sslmode=disable
  maxIdleConns: 5
  maxOpenConns: 20
  connMaxIdleTime: 15m
  connMaxLifetime: 1h

queue:
  databaseURL: postgres://postgres:postgres@localhost:5432/holonic_asset?sslmode=disable
  maxWorkers: 10
  jobTimeout: 30m

auth:
  # Replace this value with a secret of at least 32 bytes. The
  # HOLONIC_AUTH_JWT_SECRET environment variable takes precedence.
  jwtSecret: "replace-with-a-long-random-secret"
  tokenExpiry: 24h

http:
  allowedOrigins:
    - "http://localhost:5173"

pprof:
  # Enable only when runtime profiling is needed.
  enabled: false

log:
  path: ./logs/holonic-asset.log
  maxSize: 100
  maxBackups: 7
  maxAge: 14
  compress: true

image:
  defaultModel: "openai/gpt-image-2"
  fallbackModel: "google/gemini-3.1-flash-lite-image"
  models:
    - name: "openai/gpt-image-2"
      protocol: openai_images
      baseURL: "https://api.qnaigc.com"
      apiKey: ""
    - name: "google/gemini-3.1-flash-lite-image"
      protocol: chat_completions
      baseURL: "https://api.qnaigc.com"
      apiKey: ""

llm:
  defaultModel: "google/gemini-3.7-flash"
  models:
    - name: "google/gemini-3.7-flash"
      protocol: chat_completions
      baseURL: "https://api.qnaigc.com"
      apiKey: ""

video:
  baseURL: "https://api.qnaigc.com"
  apiKey: ""
  models: []
  # Polling and retry settings apply to transient QNA HTTP failures.
  pollInterval: 5s
  pollTimeout: 45s
  maxRetries: 3
  retryDelay: 2s

qiniu:
  accessKey: ""
  secretKey: ""
  bucket: ""
  # Kodo domain or virtual-host S3 endpoint. The https:// prefix is optional.
  domain: ""
  # Leave empty to use https://upload.qiniup.com.
  uploadURL: ""
  # Leave zero/empty to use 1h.
  uploadTokenExpiry: 1h
  # Leave zero/empty to use 30m.
  downloadURLExpiry: 30m
