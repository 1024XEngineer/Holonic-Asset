db:
  dsn: postgres://postgres:postgres@localhost:5432/holonic_asset?sslmode=disable
  maxIdleConns: 5
  maxOpenConns: 20
  connMaxIdleTime: 15m
  connMaxLifetime: 1h

queue:
  databaseURL: postgres://postgres:postgres@localhost:5432/holonic_asset?sslmode=disable
  maxWorkers: 10
  jobTimeout: 30m

log:
  path: ./logs/holonic-asset.log
  maxSize: 100
  maxBackups: 7
  maxAge: 14
  compress: true

image:
  baseURL: "https://api.qnaigc.com"
  apiKey: ""
  defaultModel: "openai/gpt-image-2"

video:
  baseURL: "https://api.qnaigc.com"
  apiKey: ""

qiniu:
  accessKey: ""
  secretKey: ""
  bucket: ""
  # Kodo domain or virtual-host S3 endpoint. The https:// prefix is optional.
  domain: ""
  # Leave empty to use https://upload.qiniup.com.
  uploadURL: ""
  # Leave zero/empty to use 1h.
  uploadTokenExpiry: 1h
  # Leave zero/empty to use 30m.
  downloadURLExpiry: 30m
