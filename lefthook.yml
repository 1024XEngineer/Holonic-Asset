pre-commit:
  commands:
    backend-format:
      root: "core-api/"
      glob: "*.go"
      run: golangci-lint fmt {staged_files}
      stage_fixed: true

    backend-lint:
      root: "core-api/"
      glob: "*.go"
      run: golangci-lint run

    frontend-format:
      root: "frontend/"
      glob: "*.{js,jsx,ts,tsx}"
      exclude: "src/model/generated/**"
      run: pnpm format {files}
      stage_fixed: true

    frontend-lint:
      root: "frontend/"
      glob: "*.{js,jsx,ts,tsx}"
      run: pnpm lint
